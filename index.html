    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Komponen pembantu untuk memaparkan ikon Lucide di dalam HTML/React CDN
        const Icon = ({ name, size = 24, className = '', strokeWidth = 2, title }) => {
            const [svgContent, setSvgContent] = useState('');
            
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconData = window.lucide.icons[name];
                    const svgNode = window.lucide.createElement(iconData);
                    svgNode.setAttribute('width', size);
                    svgNode.setAttribute('height', size);
                    if (className) svgNode.setAttribute('class', `lucide lucide-${name} ${className}`);
                    svgNode.setAttribute('stroke-width', strokeWidth);
                    setSvgContent(svgNode.outerHTML);
                }
            }, [name, size, className, strokeWidth]);

            return <span className={`inline-flex items-center justify-center ${className}`} title={title} dangerouslySetInnerHTML={{ __html: svgContent }} />;
        };

        const SENARAI_STAF = [
            "AZIZ BIN TAHIR", "MOHAMAD ABIDIN BIN SIPEK", "LING MEE CHOO", "SALIHIN BIN AHMAD",
            "WONG PICK KING", "TING HUA EE", "JACQUELINE TIONG HOE DING", "NUR HIDAYU BINTI YUSOP",

            "HILWA HAYATI BINTI MOHAMAD AJALAN", "JIMMY ANAK PETER", "BRYAN ANAK CONSTANT", "TING YU YONG",

        ].map(name => name.toUpperCase());

        const SENARAI_BILIK = [
            "3PK - Bilik Audiologi", "Bilik Bimbingan dan Kaunseling", "Bilik Darjah 750 kaki persegi / sama 3 bay",
            "Bilik Darjah < Daripada 750 kps / Kurang 3 bay", "Bilik Darjah Prasekolah", "Bilik Guru Besar",
            "Bilik J-Qaf", "Bilik Khas", "Bilik Komputer", "Bilik Mesyuarat Utama",
            "Bilik Operasi Skim Pinjaman Buku Teks Sekolah (BOSS)", "Bilik Pantri", "Bilik Pengurusan Sukan",
            "Bilik Penolong Kanan (Pentadbiran)", "Bilik RBT (Sekolah Rendah)", "Bilik Sains (Sekolah Rendah)",
            "Bilik Serbaguna", "Bilik Solat (Sekolah)", "Bumbung", "Dewan Terbuka (Berbumbung)",
            "Koridor/Laluan Pejalan Kaki", "Pejabat Am", "Pejabat Guru", "Pondok Pengawal (Sekolah)",
            "Pusat Sumber/Perpustakaan", "Stor Am", "Tandas Guru Lelaki", "Tandas Guru Perempuan",
            "Tandas Murid Lelaki", "Tandas Murid Perempuan", "Tandas OKU", "Tangga", "Tangki"
        ];

        const KEADAAN_FIZIKAL = [
            "Dinding", "Pendawaian", "Lantai", "Siling", "Tingkap", "Pintu", "Papan hitam/putih", "Perpaipan"
        ];

        const SENARAI_KELAS = [
            "PRASEKOLAH", "1BD", "1BP DELIMA", "1BP ZAMRUD", "2BP DELIMA", "2BP ZAMRUD",
            "3BD", "3BP", "4BD", "4BL", "4BP", "5BD", "5BP", "6BD", "6BP"
        ];

        const DrawingCanvas = ({ onSave, defaultImage, width = 600, height = 400, isSignature = false }) => {
            const bgCanvasRef = useRef(null);
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [hasDrawn, setHasDrawn] = useState(false);
            const [activeTool, setActiveTool] = useState('pen'); 
            const [snapshot, setSnapshot] = useState(null);
            const [startX, setStartX] = useState(0);
            const [startY, setStartY] = useState(0);
            const [history, setHistory] = useState([]);

            useEffect(() => {
                const bgCanvas = bgCanvasRef.current;
                const drawCanvas = canvasRef.current;
                if (!bgCanvas || !drawCanvas) return;

                const bgCtx = bgCanvas.getContext('2d');
                const drawCtx = drawCanvas.getContext('2d');
                
                if (isSignature && !hasDrawn && !defaultImage) {
                    bgCtx.fillStyle = 'white';
                    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
                }

                if (defaultImage) {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(bgCanvas.width / img.width, bgCanvas.height / img.height);
                        const x = (bgCanvas.width / 2) - (img.width / 2) * scale;
                        const y = (bgCanvas.height / 2) - (img.height / 2) * scale;
                        
                        if (isSignature) {
                            bgCtx.fillStyle = 'white';
                            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
                            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                            drawCtx.drawImage(img, x, y, img.width * scale, img.height * scale);
                        } else {
                            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                            bgCtx.drawImage(img, x, y, img.width * scale, img.height * scale);
                        }
                        setHasDrawn(true);
                        setHistory([]); 
                    };
                    img.src = defaultImage;
                }
            }, [defaultImage, isSignature]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                const drawCtx = canvasRef.current.getContext('2d');
                const { x, y } = getCoordinates(e);
                setStartX(x);
                setStartY(y);

                if (!isSignature) {
                    setSnapshot(drawCtx.getImageData(0, 0, canvasRef.current.width, canvasRef.current.height));
                }

                drawCtx.beginPath();
                drawCtx.moveTo(x, y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault(); 
                
                const drawCtx = canvasRef.current.getContext('2d');
                const { x, y } = getCoordinates(e);

                if (activeTool === 'eraser') {
                    drawCtx.lineTo(x, y);
                    drawCtx.globalCompositeOperation = 'destination-out';
                    drawCtx.strokeStyle = 'rgba(0,0,0,1)';
                    drawCtx.lineWidth = 15;
                    drawCtx.lineCap = 'round';
                    drawCtx.lineJoin = 'round';
                    drawCtx.stroke();
                    drawCtx.globalCompositeOperation = 'source-over';
                } else if (activeTool !== 'pen' && !isSignature && snapshot) {
                    drawCtx.putImageData(snapshot, 0, 0);
                    drawCtx.beginPath();
                    drawCtx.strokeStyle = '#ff0000';
                    drawCtx.lineWidth = 4;
                    drawCtx.lineCap = 'round';
                    drawCtx.lineJoin = 'round';

                    if (activeTool === 'rect') {
                        drawCtx.rect(startX, startY, x - startX, y - startY);
                    } else if (activeTool === 'circle') {
                        const radiusX = Math.abs(x - startX) / 2;
                        const radiusY = Math.abs(y - startY) / 2;
                        const centerX = Math.min(x, startX) + radiusX;
                        const centerY = Math.min(y, startY) + radiusY;
                        drawCtx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
                    } else if (activeTool === 'arrow') {
                        drawCtx.moveTo(startX, startY);
                        drawCtx.lineTo(x, y);
                        const headlen = 20;
                        const angle = Math.atan2(y - startY, x - startX);
                        drawCtx.lineTo(x - headlen * Math.cos(angle - Math.PI / 6), y - headlen * Math.sin(angle - Math.PI / 6));
                        drawCtx.moveTo(x, y);
                        drawCtx.lineTo(x - headlen * Math.cos(angle + Math.PI / 6), y - headlen * Math.sin(angle + Math.PI / 6));
                    }
                    drawCtx.stroke();
                } else {
                    drawCtx.lineTo(x, y);
                    drawCtx.strokeStyle = isSignature ? '#000000' : '#ff0000';
                    drawCtx.lineWidth = isSignature ? 2 : 4;
                    drawCtx.lineCap = 'round';
                    drawCtx.lineJoin = 'round';
                    drawCtx.stroke();
                }
                
                setHasDrawn(true);
            };

            const stopDrawing = () => {
                if (isDrawing) {
                    setIsDrawing(false);
                    const drawCanvas = canvasRef.current;
                    const bgCanvas = bgCanvasRef.current;
                    const drawCtx = drawCanvas.getContext('2d');
                    
                    const currentImgData = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
                    setHistory(prev => [...prev, currentImgData]);
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = drawCanvas.width;
                    tempCanvas.height = drawCanvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    tempCtx.drawImage(bgCanvas, 0, 0);
                    tempCtx.drawImage(drawCanvas, 0, 0);
                    
                    onSave(tempCanvas.toDataURL('image/png'));
                }
            };

            const handleUndo = () => {
                if (history.length === 0) return;
                
                const newHistory = [...history];
                newHistory.pop();
                setHistory(newHistory);
                
                const drawCanvas = canvasRef.current;
                const drawCtx = drawCanvas.getContext('2d');
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                
                if (newHistory.length > 0) {
                    drawCtx.putImageData(newHistory[newHistory.length - 1], 0, 0);
                } else {
                    if (isSignature) setHasDrawn(false);
                }
                
                const bgCanvas = bgCanvasRef.current;
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = drawCanvas.width;
                tempCanvas.height = drawCanvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.drawImage(bgCanvas, 0, 0);
                tempCtx.drawImage(drawCanvas, 0, 0);
                
                if (newHistory.length === 0 && !isSignature) {
                    onSave(bgCanvas.toDataURL('image/png'));
                } else if (newHistory.length === 0 && isSignature) {
                    onSave('');
                } else {
                    onSave(tempCanvas.toDataURL('image/png'));
                }
            };

            const clearCanvas = () => {
                const drawCanvas = canvasRef.current;
                const drawCtx = drawCanvas.getContext('2d');
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                
                setHasDrawn(false);
                setHistory([]); 

                if (!isSignature) {
                    onSave(bgCanvasRef.current.toDataURL('image/png'));
                } else {
                    onSave('');
                }
            };

            return (
                <div className="flex flex-col items-center border rounded-lg bg-gray-50 overflow-hidden relative w-full" style={{ maxWidth: `${width}px` }}>
                    <div className="relative w-full" style={{ aspectRatio: `${width} / ${height}` }}>
                        <canvas ref={bgCanvasRef} width={width} height={height} className="absolute inset-0 w-full h-full touch-none" />
                        <canvas
                            ref={canvasRef}
                            width={width}
                            height={height}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            className={`absolute inset-0 w-full h-full touch-none ${activeTool === 'eraser' ? 'cursor-cell' : 'cursor-crosshair'}`}
                        />
                    </div>
                    
                    {!isSignature && (
                        <div className="absolute top-2 left-2 flex gap-1 bg-white p-1 rounded-md shadow-sm border border-gray-200">
                            <button type="button" onClick={() => setActiveTool('pen')} className={`p-1.5 rounded-md transition-colors ${activeTool === 'pen' ? 'bg-blue-100 text-blue-600' : 'text-gray-500 hover:bg-gray-100'}`} title="Lukisan Bebas"><Icon name="pen-tool" size={16} /></button>
                            <button type="button" onClick={() => setActiveTool('rect')} className={`p-1.5 rounded-md transition-colors ${activeTool === 'rect' ? 'bg-blue-100 text-blue-600' : 'text-gray-500 hover:bg-gray-100'}`} title="Petak"><Icon name="square" size={16} /></button>
                            <button type="button" onClick={() => setActiveTool('circle')} className={`p-1.5 rounded-md transition-colors ${activeTool === 'circle' ? 'bg-blue-100 text-blue-600' : 'text-gray-500 hover:bg-gray-100'}`} title="Bulatan"><Icon name="circle" size={16} /></button>
                            <button type="button" onClick={() => setActiveTool('arrow')} className={`p-1.5 rounded-md transition-colors ${activeTool === 'arrow' ? 'bg-blue-100 text-blue-600' : 'text-gray-500 hover:bg-gray-100'}`} title="Anak Panah"><Icon name="arrow-up-right" size={16} /></button>
                            <div className="w-px bg-gray-300 mx-1"></div>
                            <button type="button" onClick={() => setActiveTool('eraser')} className={`p-1.5 rounded-md transition-colors ${activeTool === 'eraser' ? 'bg-blue-100 text-blue-600' : 'text-gray-500 hover:bg-gray-100'}`} title="Pemadam"><Icon name="eraser" size={16} /></button>
                            <div className="w-px bg-gray-300 mx-1"></div>
                            <button type="button" onClick={handleUndo} disabled={history.length === 0} className={`p-1.5 rounded-md transition-colors ${history.length === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-600'}`} title="Undur (Undo)"><Icon name="undo" size={16} /></button>
                        </div>
                    )}

                    <div className="absolute top-2 right-2 flex gap-2">
                        {hasDrawn && (
                            <button type="button" onClick={clearCanvas} className="p-1.5 bg-red-100 text-red-600 rounded-md hover:bg-red-200 transition-colors shadow-sm text-sm flex items-center gap-1">
                                <Icon name="trash-2" size={14} /> Padam
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl transform transition-all">
                        <h3 className="text-lg font-bold text-gray-900 mb-4">Pengesahan</h3>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 font-medium">Batal</button>
                            <button onClick={onConfirm} className="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700 font-medium">Ya, Padam</button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('form');
            const [reports, setReports] = useState([]);
            const schoolLogo = '6296237493061357492 (1).jpg'; // Logo rasmi
            const [reportToPrint, setReportToPrint] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [reportToVerify, setReportToVerify] = useState(null);
            const [deleteId, setDeleteId] = useState(null);
            const imageInputRef = useRef(null);

            const [formData, setFormData] = useState({
                id: null,
                staffName: '',
                roomType: '',
                roomName: '',
                date: new Date().toISOString().split('T')[0],
                conditions: [],
                description: '',
                images: [], 
                signature: '',
                status: 'pending',
                gbSignature: '',
                gbName: '',
                gbAction: '',
                gbDate: ''
            });

            useEffect(() => {
                const savedReports = localStorage.getItem('laporanKerosakan');
                if (savedReports) setReports(JSON.parse(savedReports));
            }, []);

            useEffect(() => {
                localStorage.setItem('laporanKerosakan', JSON.stringify(reports));
            }, [reports]);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if (formData.images.length < 2) {
                            setFormData(prev => ({
                                ...prev,
                                images: [...prev.images, { id: Date.now(), original: reader.result, annotated: reader.result }]
                            }));
                        }
                    };
                    reader.readAsDataURL(file);
                }
                if (e.target) e.target.value = '';
            };

            const handleConditionChange = (condition) => {
                const current = formData.conditions;
                const updated = current.includes(condition)
                    ? current.filter(c => c !== condition)
                    : [...current, condition];
                setFormData({ ...formData, conditions: updated });
            };

            const handleGenerateAI = async (e) => {
                if (formData.images.length === 0 && (!formData.description || formData.description.trim() === '')) {
                    const btn = e.currentTarget;
                    const oldText = btn.innerHTML;
                    btn.innerHTML = 'Perlukan gambar atau nota!';
                    btn.classList.remove('bg-indigo-50', 'text-indigo-600');
                    btn.classList.add('bg-red-100', 'text-red-600');
                    setTimeout(() => {
                        btn.innerHTML = oldText;
                        btn.classList.remove('bg-red-100', 'text-red-600');
                        btn.classList.add('bg-indigo-50', 'text-indigo-600');
                    }, 3000);
                    return;
                }

                setIsGenerating(true);
                try {
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const userNote = formData.description ? `Nota tambahan: ${formData.description}` : '';
                    const prompt = `Berdasarkan gambar kerosakan yang disertakan (jika ada) dan nota berikut, tuliskan satu perenggan penerangan rasmi dan profesional (dalam Bahasa Melayu) mengenai kerosakan fizikal tersebut. Penerangan ini akan digunakan dalam laporan rasmi kerosakan fasiliti sekolah. Terus kepada intipati kerosakan tanpa pendahuluan surat. ${userNote}`;

                    const parts = [{ text: prompt }];

                    formData.images.forEach(img => {
                        if (img.original) {
                            const arr = img.original.split(',');
                            if (arr.length === 2) {
                                const mimeMatch = arr[0].match(/:(.*?);/);
                                if (mimeMatch) {
                                    parts.push({
                                        inlineData: { mimeType: mimeMatch[1], data: arr[1] }
                                    });
                                }
                            }
                        }
                    });

                    const payload = { contents: [{ role: "user", parts: parts }] };
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    if (result.candidates && result.candidates[0].content) {
                        const generatedText = result.candidates[0].content.parts[0].text;
                        setFormData(prev => ({ ...prev, description: generatedText.trim() }));
                    }
                } catch (error) {
                    console.error("Error generating AI description:", error);
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.staffName || !formData.roomType || !formData.date || !formData.signature) {
                    const btn = document.getElementById('submitBtn');
                    const oldText = btn.innerHTML;
                    btn.innerHTML = 'Sila lengkapkan borang (Nama, Bilik, Tarikh & Tandatangan)';
                    btn.classList.add('bg-red-500');
                    setTimeout(() => {
                        btn.innerHTML = oldText;
                        btn.classList.remove('bg-red-500');
                    }, 3000);
                    return;
                }

                if (formData.id) {
                    setReports(reports.map(r => r.id === formData.id ? formData : r));
                } else {
                    setReports([{ ...formData, id: Date.now() }, ...reports]);
                }
                
                resetForm();
                setActiveTab('records');
            };

            const resetForm = () => {
                setFormData({
                    id: null, staffName: '', roomType: '', roomName: '',
                    date: new Date().toISOString().split('T')[0], conditions: [], description: '',
                    images: [], signature: '', status: 'pending', gbSignature: '', gbName: '', gbAction: '', gbDate: ''
                });
                if (imageInputRef.current) imageInputRef.current.value = '';
            };

            const editReport = (report) => {
                let reportImages = report.images || [];
                if (reportImages.length === 0 && report.evidenceImage) {
                    reportImages = [{ id: Date.now(), original: report.evidenceImage, annotated: report.annotatedImage }];
                }
                setFormData({ 
                    ...report, images: reportImages, status: report.status || 'pending',
                    gbSignature: report.gbSignature || '', gbName: report.gbName || '',
                    gbAction: report.gbAction || '', gbDate: report.gbDate || ''
                });
                setActiveTab('form');
            };

            if (activeTab === 'print' && reportToPrint) {
                const isBilikDarjah = reportToPrint.roomType.toLowerCase().includes('bilik darjah');
                const bilikDisplay = isBilikDarjah && reportToPrint.roomName ? `${reportToPrint.roomType} (${reportToPrint.roomName})` : reportToPrint.roomType;
                let displayImages = reportToPrint.images || [];
                if (displayImages.length === 0 && reportToPrint.evidenceImage) {
                    displayImages = [{ original: reportToPrint.evidenceImage, annotated: reportToPrint.annotatedImage }];
                }

                return (
                    <div className="bg-gray-100 min-h-screen py-8 print-py-0 print:bg-white overflow-auto flex flex-col items-center">
                        <div className="w-full max-w-[210mm] mb-6 flex justify-between items-center print-hidden px-4 md:px-0 controls-print">

                                        <div><span className="block text-slate-500 text-xs mb-1">Lokasi</span><span className="font-semibold text-slate-800">{reportToVerify.roomType} {reportToVerify.roomName ? `(${reportToVerify.roomName})` : ''}</span></div>
                                        <div><span className="block text-slate-500 text-xs mb-1">Tarikh Dilapor</span><span className="font-semibold text-slate-800">{new Date(reportToVerify.date).toLocaleDateString('ms-MY')}</span></div>
                                        <div className="col-span-2"><span className="block text-slate-500 text-xs mb-1">Penerangan</span><span className="text-slate-700 block">{reportToVerify.description || '-'}</span></div>
                                    </div>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!reportToVerify.gbSignature) {
                                        const btn = document.getElementById('verifySubmitBtn');
                                        const oldText = btn.innerHTML;
                                        btn.innerHTML = 'Sila Turunkan Tandatangan!';
                                        btn.classList.replace('bg-green-600', 'bg-red-500');
                                        setTimeout(() => { btn.innerHTML = oldText; btn.classList.replace('bg-red-500', 'bg-green-600'); }, 3000);
                                        return;
                                    }
                                    const updatedReport = { ...reportToVerify, status: 'verified', gbDate: new Date().toISOString().split('T')[0] };
                                    setReports(reports.map(r => r.id === updatedReport.id ? updatedReport : r));
                                    setActiveTab('records');
                                    setReportToVerify(null);
                                }} className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-2">Nama Guru Besar / Jawatan</label>
                                        <input type="text" required value={reportToVerify.gbName} onChange={(e) => setReportToVerify({ ...reportToVerify, gbName: e.target.value })} className="w-full p-3 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all outline-none" placeholder="Contoh: GURU BESAR SKPK MIRI" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-2">Ulasan / Tindakan Susulan (Pilihan)</label>
                                        <textarea rows="3" value={reportToVerify.gbAction || ''} onChange={(e) => setReportToVerify({ ...reportToVerify, gbAction: e.target.value })} className="w-full p-3 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all outline-none resize-y" placeholder="Nyatakan ulasan, status pembaikan atau tindakan susulan..."></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-2">Tandatangan Pengesahan <span className="text-red-500">*</span></label>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-center">
                                            <DrawingCanvas isSignature={true} width={400} height={200} defaultImage={reportToVerify.gbSignature} onSave={(dataUrl) => setReportToVerify({...reportToVerify, gbSignature: dataUrl})} />
                                        </div>
                                    </div>
                                    <div className="flex gap-3 pt-4 border-t border-slate-100">
                                        <button type="button" onClick={() => { setActiveTab('records'); setReportToVerify(null); }} className="flex-1 py-3 bg-white border border-slate-300 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-all">Batal</button>
                                        <button id="verifySubmitBtn" type="submit" className="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold shadow-lg shadow-green-200 hover:bg-green-700 hover:shadow-green-300 transition-all flex items-center justify-center gap-2">
                                            <Icon name="shield-check" size={20} /> Sahkan Laporan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
